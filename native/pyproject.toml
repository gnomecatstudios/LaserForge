[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "laserforge-native"
version = "0.2.5"
description = "Experimental native Qt Widgets interface for LaserForge"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6==6.8.3"]

[project.scripts]
laserforge-native = "laserforge_native.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["laserforge_native*"]
