<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LaserForge renderer benchmark</title></head>
<body style="margin:0"><canvas id="canvas" width="1440" height="900"></canvas>
<script type="module">
import { drawBed, drawObjects } from '/src/app/canvas/scene-render.ts';
import { hitObject } from '/src/app/canvas/hit-test.ts';
import { fitBed, zoomAt } from '/src/app/canvas/viewport.ts';
const canvas = document.getElementById('canvas');
const context = canvas.getContext('2d');
const bed = { width: 400, height: 400, originCorner: 'bl' };
const size = { width: 1440, height: 900 };
const palette = {
  bg:'#181818',bed:'#ffffff',gridMinor:'#eeeeee',gridMajor:'#dddddd',border:'#777777',
  textDim:'#555555',beam:'#4cc9f0',signal:'#c0392b',signalSoft:'#f59a95',surface:'#eeeeee',photo:'#b794f6',
};
const summarize = (samples) => {
  const sorted = [...samples].sort((a,b)=>a-b);
  return { median_ms: sorted[Math.floor(sorted.length/2)], p95_ms: sorted[Math.min(sorted.length-1, Math.floor(sorted.length*.95))], samples: sorted.length };
};
window.runBenchmark = (project, iterations=30) => {
  let view = fitBed(size, bed);
  const draw = () => {
    drawBed(context, view, bed, palette, size);
    drawObjects(context, project, view, bed, () => ({ bitmap:null,caption:'' }), palette);
    // Readback forces queued Canvas drawing to complete; Qt harness likewise paints a CPU image.
    context.getImageData(0,0,1,1);
  };
  const loadStart = performance.now(); draw();
  const firstDraw = performance.now()-loadStart;
  for(let i=0;i<5;i++) draw();
  const redraw=[], zoomPan=[], selection=[];
  for(let i=0;i<iterations;i++) {
    let start=performance.now(); draw(); redraw.push(performance.now()-start);
    view=zoomAt(view, i%2 ? 0.98 : 1/0.98, {x:720,y:450});
    view={...view,offsetX:view.offsetX+(i%2 ? -3 : 3)};
    start=performance.now(); draw(); zoomPan.push(performance.now()-start);
    start=performance.now();
    hitObject(context,project,view,bed,{x:1,y:1}); // Deliberate miss exercises all candidates.
    selection.push(performance.now()-start);
  }
  return { renderer:'legacy Canvas2D', objects:project.objects.length, first_draw_ms:firstDraw,
    redraw:summarize(redraw), zoom_pan_redraw:summarize(zoomPan), selection_miss:summarize(selection),
    viewport:size, device_pixel_ratio:devicePixelRatio, user_agent:navigator.userAgent,
    js_heap_bytes:performance.memory?.usedJSHeapSize ?? null };
};
window.benchmarkReady=true;
</script></body></html>
