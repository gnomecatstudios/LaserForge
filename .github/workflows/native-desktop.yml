name: Experimental native desktop

on:
  push:
    branches: [native-render-version-2]
    paths: ['native/**', 'scripts/build-native.py', 'scripts/smoke-native-package.py', '.github/workflows/native-desktop.yml']
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/build-native.py'
      - 'scripts/smoke-native-package.py'
      - 'packages/libopenlaser/**'
      - '.github/workflows/native-desktop.yml'

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"target":"windows-x64","os":"windows-latest"}]' || '[{"target":"windows-x64","os":"windows-latest"},{"target":"linux-x64-mint-candidate","os":"ubuntu-22.04"},{"target":"linux-arm64-pi-candidate","os":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r native/requirements-build.txt
      - run: python -m pip install -e native --no-deps
      - name: Build retained core bridge
        run: pnpm exec vite build --config native/bridge/vite.config.ts
      - name: Native core and Qt interaction tests
        run: python -m unittest discover -s native/tests -p "test_*.py"
      - name: Native source smoke
        run: python -m laserforge_native --smoke-test
      - name: Package on target operating system
        run: python scripts/build-native.py --skip-bridge-build
      - name: Smoke packaged application using bundled runtime
        run: python scripts/smoke-native-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: LaserForge-native-experimental-${{ matrix.target }}
          path: native/artifacts/*
          if-no-files-found: error
