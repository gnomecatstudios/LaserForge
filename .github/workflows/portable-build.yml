name: Build portable packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified ZIPs to LaserForgeDownloads
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s portable -p 'test_*.py'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm icons
      - run: pnpm build
      - run: python3 scripts/build-portable.py --revision "${GITHUB_SHA:0:7}"
      - run: python3 scripts/verify-portable-branding.py
      - uses: actions/upload-artifact@v4
        with:
          name: LaserForge-verified-packages
          path: |
            portable/downloads/*.zip
            portable/downloads/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish verified portable release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.LASERFORGE_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Configure LASERFORGE_DOWNLOADS_TOKEN with write access to LaserForgeDownloads.' >&2
            exit 1
          fi
          python3 scripts/publish-downloads.py --packages portable/downloads --publish
