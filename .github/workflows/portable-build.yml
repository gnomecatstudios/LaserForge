name: Build portable packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-build.yml'
      - 'portable/**'
      - 'scripts/build-portable.py'
      - 'scripts/verify-portable-*.py'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s portable -p 'test_*.py'
      - run: pnpm build
      - run: python3 scripts/build-portable.py
      - run: python3 scripts/verify-portable-branding.py
      - uses: actions/upload-artifact@v4
        with:
          name: LaserForge-verified-packages
          path: portable/downloads/
          if-no-files-found: error
